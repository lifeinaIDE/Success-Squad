<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Success Squad | EDC</title>
    <!--
      GitHub Pages has no server-side router, so any deep link (e.g. /events)
      returns this 404 page. This script rewrites the URL into a query string
      and redirects to index.html, where the companion script already in
      index.html restores it — letting React Router take over normally.
      pathSegmentsToKeep = 1 because this is a project page served from
      https://<username>.github.io/<repo-name>/ (the repo name segment must
      be preserved). Set it to 0 only if deploying to a custom domain root.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
