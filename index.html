<!DOCTYPE html>
<html lang="en" style="background-color: #0a0a0f;">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      window.addEventListener('vite:preloadError', function() {
        window.location.reload();
      });

      function showFatalError(title, msg, stack) {
        var box = document.getElementById('debug-fatal-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'debug-fatal-box';
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f17;color:#f87171;padding:32px;z-index:99999999;font-family:monospace;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;';
          var container = document.body || document.documentElement;
          container.appendChild(box);
        }
        box.innerHTML = '<h2 style=\"color:#ef4444;font-size:1.6rem;margin-bottom:12px;\">' + title + '</h2>' +
          '<p style=\"color:#fff;max-width:600px;line-height:1.6;margin-bottom:16px;\">' + (msg || '') + '</p>' +
          (stack ? '<pre style=\"background:#14141f;border:1px solid rgba(255,255,255,0.1);color:#e2e8f0;padding:16px;border-radius:8px;max-width:800px;text-align:left;font-size:0.8rem;overflow:auto;\">' + stack + '</pre>' : '') +
          '<button onclick=\"window.location.reload()\" style=\"margin-top:20px;padding:10px 24px;background:#6366f1;color:#fff;border:none;border-radius:50px;font-weight:600;cursor:pointer;\">Reload Application</button>';
      }

      window.addEventListener('DOMContentLoaded', function() {
        fetch('/__client_log?event=DOMContentLoaded&url=' + encodeURIComponent(window.location.href));
      });

      window.addEventListener('error', function(e) {
        fetch('/__client_log?event=window_error&msg=' + encodeURIComponent(e.message) + '&src=' + encodeURIComponent(e.filename + ':' + e.lineno));
        showFatalError('Startup Error Detected', e.message, e.error && e.error.stack ? e.error.stack : (e.filename + ':' + e.lineno));
      });

      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        fetch('/__client_log?event=unhandled_rejection&msg=' + encodeURIComponent(r && r.message ? r.message : String(r)));
        showFatalError('Unhandled Promise Exception', r && r.message ? r.message : String(r), r && r.stack ? r.stack : '');
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Oswald:wght@600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/Success Squad.jpg" />
    <title>Success Squad | EDC</title>
  </head>
  <body style="background-color: #0a0a0f; color: #ffffff; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="initial-preloader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;color:#ffffff;font-family:'Inter',sans-serif;gap:16px;">
        <div style="width:40px;height:40px;border:3px solid rgba(99,102,241,0.2);border-top-color:#6366f1;border-radius:50%;animation:preloader-spin 0.8s linear infinite;"></div>
        <p style="font-size:0.88rem;color:rgba(255,255,255,0.6);letter-spacing:1px;text-transform:uppercase;margin:0;">Loading Success Squad...</p>
        <style>@keyframes preloader-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
